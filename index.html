  'The first time you open a forge, choose a profession: Metal, Leather or Cloth. The one that suits your class is marked for you.',
  'Your profession decides which armor you forge. Everyone can still forge weapons, charms and cloaks, and anyone can brew tonics.',
  'Forging raises your rank, from Novice up to Master. Higher ranks give a small chance of better rarity or an extra socket, and better forges earn rank faster.',
  'You can switch profession for a fee at any shop\'s Craft tab, but your rank starts again.',
  'Forging now costs gold as well as materials. Brewing tonics is still free.']},
 {id:21,date:'4 Nov 2026',title:'Durability and repairs',items:[
  'Gear now wears out slowly as you fight, and each time you fall it loses 10% durability. You can see durability on every item.',
  'A notice appears when your gear drops to 25%. Broken gear gives no stats, gems or effects until it is repaired, but it is never destroyed.',
  'Every shop has a new Repair tab. Repair one item or use Repair All. The price depends on the item and how worn it is.']},
 {id:20,date:'4 Nov 2026',title:'Gems and sockets',items:[
  'Gems have arrived. Bosses always drop at least one, and so do the named monsters you hunt for quests. Later zones drop rarer gems.',
  'Rubies add Strength, Emeralds Agility, Sapphires Intelligence, Topazes Vitality and Amethysts Critical Chance.',
  'Rare and better weapons, charms and cloaks you find from now on can have sockets. Open your bag and use the Gem tab to set a gem in equipped gear.',
  'Remove a gem for free at any time from the item it is in. Selling an item returns its gems.',
  'Fuse five matching gems into one of the next level, up to level 5. Gems in sockets can\'t be fused.']},
 {id:19,date:'4 Nov 2026',title:'Five hero slots',items:[
  'You can now keep up to five heroes at once, each with their own progress. Your current hero is already in your first slot.',
  'Starting a new hero no longer replaces an old one. It takes the next empty slot, and you choose who to play from the title screen.',
  'Export a hero to a file as a backup, or to move them to another device, then use Import to bring them back.',
  'Deleting a hero now asks you to confirm from the title screen, and only removes that one hero.']},
 {id:18,date:'4 Nov 2026',title:'Safer saves and fewer dead ends',items:[
  'If your browser can\'t save your progress, the game now tells you instead of failing silently.',
  'If a saved hero can\'t be read, a copy is kept. Starting a new hero won\'t erase it.',
  'If the graphics are interrupted, the game pauses, saves your hero and reloads when they return.',
  'If something goes wrong, you now see a message with a Reload button and a report you can copy and email to us.',
  'Fixed: the final quest, Heart of Cinders, now says it rewards a Legendary item. It always did, but it was labelled Uncommon.',
  'Options > Display & sound can now show your frame rate, to help track down slowdowns.',
  'The last guardian of Emberfall Caldera is now level 50, matching the level cap, so it is very slightly less tough.']},
 {id:17,date:'3 Nov 2026',title:'A bigger bag, tonics and food',items:[
  'Each bag page now holds 18 slots instead of 9, and you can grow your bag up to 54 slots.',
  'Marsh Tonics are now items in your bag. They stack up to 20, and your tonic quick slot drinks from them. Any tonics you had are already in your bag.',
  'Food has arrived. Every town sells its own dish: Hollowmere Loaf, Spiced Dates, Smoked Rimefish, Duskcap Stew and Emberroot Roast. Monsters sometimes drop it too.',
  'Eat outside a fight to restore health and mana over 10 seconds. The finer dishes also leave you Well Fed for 5 minutes, with extra speed, damage or toughness. Taking a hit stops the meal.',
  'Tap any tonic or meal in your bag to drink, eat or sell it.']},
 {id:16,date:'3 Nov 2026',title:'The talent web',items:[
  'Talents are now a web. Start at your class core in the middle and work outward along six paths, each one built around a different way to play your class.',
  'You earn a talent point every level, 49 in all, and the web holds 91 ranks, so no hero can learn everything. Pick three or four paths, or weave between them.',
  'A node opens once a connected node is fully learned. Bridge strands link each path to the next, so you can cross into a neighbouring path without starting it from the centre.',
  'Notables (diamonds) and keystones (the large outer circles) change how your spells work: three rifts from Earthsplitter, meteors that fall in threes, arrows in waves, Sanctuary that walks with you, a Bladestorm that will not stop.',
  'Every class has its own web of 43 upgrades. Tap a node to read it, then tap Learn (or tap it again).',
  'Your old talent points have been given back to spend on the new web.']},
 {id:15,date:'3 Nov 2026',title:'Level cap raised to 50',items:[
  'You can now reach level 50. Every level is a smaller step than before, so the climb feels steadier, and the total time to the top is about the same.',
  'Zones now span the new range: Veylmoor 1–19, Sunscar Dunes 17–27, Frostfang Reach 25–35, Gloamwood 33–43 and Emberfall Caldera 41–50. Monsters, quests, area bosses and gear have moved up to match.',
  'Your later spells are now learned at levels 5 and 11.',
  'Your saved hero carries over. Your level, your progress toward the next one and your gear move onto the new scale, and nothing is lost.']},
 {id:14,date:'3 Nov 2026',title:'New spell icons',items:[
  'Every spell has its own picture now, drawn to show what it does: Shield Bash shows the impact, Cinder Chains a burning chain, Volley a fan of arrows, Mend a healing heart, Execute the falling blade, and so on.',
  'No two spells share an icon any more. Oathcry and Battle Roar used to look the same.',
  'The buff and debuff icons above your health bar use the new pictures too.']},
 {id:13,date:'3 Nov 2026',title:'A longer road, and fiercer foes',items:[
  'Levelling is much slower now. Reaching level 25 is meant to take around 65 hours, and gearing up in full Legendary around 35 more. Quests still give a good share of your experience.',
  'Legendary gear is rarer: monsters drop it less often, area bosses return after 15 minutes instead of 5, and forging Legendary gear takes more materials. Rare Find helps more than ever.',
  'Resource nodes take longer to grow back.',
  'Every monster now has its own attacks. Wolves pounce and howl for their pack, scorpions sting in a line, ghouls grab and spit bile, raiders spin and throw sand, wraiths scream, witches root you in thorns, ash hounds breathe fire, cinder husks erupt, and much more. Watch for red warnings on the ground.',
  'Monsters can now poison, burn, bleed, chill, root, stun and weaken you, each with its own icon by your health bar. Dodge roll out of roots. Tonics cure poison, burns, bleeding and chill, and the Lumen\'s Mend and Sanctuary cure everything.',
  'Monsters are a little tougher overall, and every attack has its own sound.']},
 {id:12,date:'3 Nov 2026',title:'Talking to quest givers',items:[
  'Fixed: Tamsin, Odette, Fennick and Rusk now offer and accept their quests. Talk to them for quests, then press Trade to open their shop.',
  'Quests are only taken and handed in face to face. Walk up to the quest giver and talk to them.',
  'The quest log now tells you who to find, and where, for quests you have not taken yet.']},
 {id:11,date:'3 Nov 2026',title:'A wilder world, and things to gather',items:[
  'Every zone has been redrawn: forests grow in thickets with clearings between them, roads wind, streams and a lava river cut through the land, and rocky outcrops break up the open ground.',
  'New landmarks mark the places quests send you: the Old Watchtower, the Barrow Ring, the Broken Well, the Bone Arch, the Rime Circle, the standing stones of Gloamwood, the Old Forge and the smoking vents of the Magma Rift, plus camps, graveyards and crystal fields.',
  'Ore veins, herb patches and crystals now grow across every zone. Veylmoor gives Common materials, the Dunes Uncommon, Frostfang Rare, Gloamwood Epic and Emberfall Legendary, with a small chance of something better. They grow back after a while.',
  'Materials go into your bag like any other item and stack up to 50 per slot. Sell them, or take them to any shop and use the new Craft tab to brew tonics or forge gear of your level, as rare as the materials you bring.']},
 {id:10,date:'3 Nov 2026',title:'New gear',items:[
  'Every weapon and piece of armor now has its own picture, drawn in its material and glowing with its rarity.',
  'Each class wields its own weapon types: one-handed swords, maces and axes for the Bulwark; greataxes, greatswords, mauls and polearms for the Reaver; staves and wands for the Ashcaller; bows and crossbows for the Thornstalker; scepters and staves for the Lumen.',
  'Armor comes in three families: plate for Bulwark and Reaver, leather for Thornstalker, and cloth for Ashcaller and Lumen. Plate has the most armor, and cloth leans on Intelligence.',
  'Gear is named by its material, from Iron up to Starforged, with new names for each rarity, and Epic sets named for each zone. Each class has its own Legendary weapon.',
  'Weapon types play differently: two-handed weapons hit harder, one-handed weapons add armor, wands speed up your casting, crossbows add critical damage and bows add critical chance.',
  'Your old gear keeps its stats and gets a picture too.']},
 {id:9,date:'3 Nov 2026',title:'Wading',items:[
  'Walking through shallow water, flooded floors or lava shallows now slows you down. The deeper it is, the slower you go.',
  'You stay soaked and a little slower for a moment after climbing out. A debuff icon shows how much you are slowed.',
  'Your mount wades through water more easily than you do on foot.']},
 {id:8,date:'3 Nov 2026',title:'Controller support',items:[
  'Play with a controller. Xbox controllers work out of the box, and PlayStation button names can be picked under Options > Controls.',
  'Left stick moves and right stick looks. A jumps, or talks and uses things when you are next to them. X attacks, B dodges.',
  'Skills sit on LB, RB, LT, RT and Y. The D-pad drinks a tonic, calls your mount, picks the next target and shows the minimap.',
  'Menus work with the controller too: the D-pad moves between buttons, A selects, B goes back, and LB and RB switch tabs.',
  'Your controller rumbles when you take a heavy hit. Turn it off with the Vibration setting.']},
 {id:7,date:'3 Nov 2026',title:'Play on PC',items:[
  'Full keyboard and mouse controls. Every key is listed under Options > Controls.',
  'All your skills now sit on one action bar, with tooltips when you hover over them.',
  'Hold a mouse button and drag to look around. Click a monster to attack it, or someone close by to talk.',
  'Changed on keyboard: Space now jumps and F attacks.',
  'The interface scales up to suit large monitors, and Options has a fullscreen switch.',
  'Fixed: holding two movement keys no longer counts as a sprint, so it stops draining your stamina.',
  'New: this update log. A dot appears when there is an update you have not read yet.']},
 {id:6,date:'2 Nov 2026',title:'Controls and display settings',items:[
  'Options now has tabs for Controls, Display & sound, and Game.',
  'New controls settings: invert look, look sensitivity, camera distance, and sprinting with the stick.',
  'New display and sound settings: sound volume, screen shake and vibration.',
  'One button now resets every setting to its default.',
  'Emberfall Caldera has calmer colors and less clutter.']},
 {id:5,date:'2 Nov 2026',title:'The campaign',items:[
  'The story now runs across five zones. Gloamwood and Emberfall Caldera join Veylmoor, Sunscar Dunes and Frostfang Reach.',
  'Each zone has an area boss. Defeat it to awaken the waystone to the next zone.',
  '50 quests to complete, with new types: gather, explore, hunt, rescue, defend, destroy and deliver.']},
 {id:4,date:'2 Nov 2026',title:'Every spell reworked',items:[
  'Every class has new spell effects, sounds and damage.',
  'Bulwark: Warblade Strike adds a shield, Oathcry pulls foes to you, and the new Bastion ward sends damage back.',
  'Ashcaller: burns stack on your foes, the new Cinder Chains roots groups, and Meteor leaves a burning crater.',
  'Thornstalker: every 4th Quick Shot fires two arrows, Volley slows a wide fan of foes, and the new Deadeye always crits.',
  'Lumen: Light Mote heals you as it hits, Halo weakens foes, and the new Dawnbreak stuns an area and heals you.',
  'Reaver: Hew opens bleeding wounds, your bleeds heal you, and Execute resets its cooldown when it kills.']},
 {id:3,date:'2 Nov 2026',title:'New class, gear and stamina',items:[
  'New class: the Reaver, a two-handed warrior.',
  'Gear now comes in five tiers, from Worn up to Exalted.',
  'Gear now grants Strength, Agility, Intelligence and Vitality. Each class has a main attribute to look for.',
  'Rare, Epic and Legendary gear rolls special effects such as critical chance, movement speed and faster cooldowns.',
  'A new stamina bar powers sprinting and a new dodge roll.']},
 {id:2,date:'2 Nov 2026',title:'A new look',items:[
  'The HUD and menus have a new slate-and-rune look.']},
 {id:1,date:'2 Nov 2026',title:'Wardens of Veylmoor opens',items:[
  'Four classes to play: Bulwark, Ashcaller, Thornstalker and Lumen, each with six skills and a talent tree.',
  'Three regions linked by waystones, with quests, loot, mounts and a minimap.',
  'The Sunken Abbey dungeon and its boss.',
  'Plays in your browser and installs on your phone like an app.']}];
const UPDKEY='veylmoor-seen-update',UPDNOW=UPDATES[0].id;
let updSeen=null,updShown=UPDNOW;
function storeSeen(v){try{localStorage.setItem(UPDKEY,v)}catch(_){}}
/* A brand new player has nothing to catch up on. A returning player with no record gets just the latest entry flagged. */
function seenUpdate(){if(updSeen!==null)return updSeen;let v=null;try{v=localStorage.getItem(UPDKEY)}catch(_){}
 if(v===null){updSeen=anySave()?UPDNOW-1:UPDNOW;storeSeen(updSeen)}else updSeen=+v||0;return updSeen}
const hasNewUpdate=()=>seenUpdate()<UPDNOW;
function markUpdatesSeen(){updShown=seenUpdate();updSeen=UPDNOW;storeSeen(UPDNOW);updateBadges()}
const updDotHTML=()=>`<i class="updDot" role="img" aria-label="New update" ${hasNewUpdate()?'':'hidden'}></i>`;
function updatesHTML(){return`<div class="pad upd">${UPDATES.map((u,i)=>{const fresh=u.id>updShown;return`<article class="upd-e${fresh?' new':''}"><div class="upd-h"><h3>${esc(u.title)}</h3>${fresh?'<span class="upd-tag">New</span>':i===0?'<span class="upd-tag now">Latest</span>':''}<span class="upd-d">${esc(u.date)}</span></div><ul>${u.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></article>`}).join('')}</div>`}
ICON.news='<path d="M12 4l1.9 5.6 5.6 1.9-5.6 1.9L12 19l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M19 3v4M17 5h4"/><path d="M5 17v4M3 19h4"/>';
const NAV=[['bag','Bag','bag'],['char','Character','person'],['quests','Quests','scroll'],['spells','Spells','book'],['map','World Map','map'],['options','Options','gear'],['updates','Updates','news']];
const NAVK=NAV.map(n=>n[0]);
const KEYS=[['Move','W A S D'],['Look','Hold mouse + drag'],['Sprint','Shift'],['Jump','Space'],['Dodge roll','V (Bulwark: hold to block)'],['Attack','F or click a foe'],['Skills','1 to 5'],['Next target','Tab'],['Talk or use','E'],['Tonic','Q'],['Mount','R'],['Zoom','Mouse wheel'],['Bag','B'],['Character','C'],['Quests','L'],['Spells','K'],['World map','M'],['Minimap','N'],['Options','O'],['Updates','U'],['Menu','Esc']];
let TORN=null;function tornClip(){if(TORN)return TORN;const r=rng(7),pts=[],N=34,j=()=>(r()*5).toFixed(1);for(let i=0;i<=N;i++)pts.push(`${(i/N*100).toFixed(2)}% ${j()}px`);for(let i=1;i<N;i++)pts.push(`calc(100% - ${j()}px) ${(i/N*100).toFixed(2)}%`);for(let i=N;i>=0;i--)pts.push(`${(i/N*100).toFixed(2)}% calc(100% - ${j()}px)`);for(let i=N-1;i>0;i--)pts.push(`${j()}px ${(i/N*100).toFixed(2)}%`);return TORN=`polygon(${pts.join(',')})`}
function openPanel(kind,arg){releaseLook();$h('skTip').hidden=true;if(kind==='updates')markUpdatesSeen();G.panel=kind;G.panelArg=arg;G.tip=null;G.confirm=null;input.sx=input.sy=0;resetStick();const solo=!NAVK.includes(kind)||G.mode!=='play';$h('bk').classList.toggle('solo',solo);$h('book').classList.toggle('left',!solo);$h('bk').style.clipPath='';
 $h('bkNav').innerHTML=solo?'':NAV.map(([k,l,ic])=>`<button class="navb ${k===kind?'on':''}" data-nav="${k}">${svg(ic)}<span>${l}</span>${k==='updates'?updDotHTML():''}</button>`).join('');
 $h('book').hidden=false;EL.lootwin.hidden=true;lastLootKey='~';renderPanel();$h('bkMain').scrollTop=0}
function closePanel(force){if(G.panel==='dead'&&!force)return;G.panel=null;$h('book').hidden=true;G.tip=null;G.confirm=null}
function rewards(q){let s=`<b>${q.xp}</b> XP · <b>${q.gold}</b><i class="coin"></i>`;if(q.item)s+=` · ${q.item.rar===4?'a Legendary':q.item.rar===3?'an Epic':q.item.rar===2?'a Rare':'an Uncommon'} ${q.item.slot?SLOTNAME[q.item.slot].toLowerCase()+' item':'item'}`;if(q.potions)s+=` · ${q.potions} tonics`;return`<div class="rew">Rewards: ${s}</div>`}
function statLines(it){let h='';const st=it.st;
 if(st.wd)h+=`<div style="font-weight:700">${st.wd} Weapon Damage</div>`;if(st.arm)h+=`<div style="font-weight:700">${st.arm} Armor</div>`;
 for(const k of ATTR)if(st[k])h+=`<div>${fmtStat(k,st[k])} ${STATN[k]}${k===CLS.main?' <span style="color:var(--brass2)">◆</span>':''}</div>`;
 for(const k of SPEC)if(st[k])h+=`<div class="st g">${fmtStat(k,st[k])} ${STATN[k]}</div>`;return h}
function gemIcon(k){const g=gemParse(k);if(!g)return'';const c=GEMCOL[g.c].c;return`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8l20 14-8 30H20l-8-30z" fill="${c}" stroke="#1a1410" stroke-width="2"/><path d="M32 8v16M12 22l20 2 20-2M32 24L20 52M32 24l12 28" stroke="#fff" stroke-opacity=".45" fill="none"/></svg>`}
function socketsHTML(it,rm){if(!it.soc||!it.soc.length)return'';return`<div class="socs">${it.soc.map((k,i)=>{const b=k&&gemBonus(k);return b?`<div class="socrow"><span class="socic">${gemIcon(k)}</span><span>${esc(gemName(k))}: +${b.v}${b.st==='crit'?'%':''} ${STATN[b.st]}</span>${rm?`<button class="cbtn socbtn" data-act="unsock" data-i="${i}">Remove</button>`:''}</div>`:`<div class="socrow"><span class="socic empty"></span><span>Empty socket</span></div>`}).join('')}</div>`}
function gemTabHTML(){const keys=Object.keys(P.gems||{}).filter(k=>P.gems[k]>0&&gemParse(k)).sort((a,b)=>{const x=gemParse(a),y=gemParse(b),o=Object.keys(GEMCOL);return o.indexOf(x.c)-o.indexOf(y.c)||x.r-y.r||x.l-y.l});let h='';for(const k of keys){const g=gemParse(k);h+=`<button class="islot has" style="--rc:${RAR[g.r].c}" data-act="selgem" data-k="${k}" aria-label="${esc(gemName(k))}, ${P.gems[k]} owned">${gemIcon(k)}<i class="gemlv">${g.l}</i><i class="qty">${P.gems[k]}</i></button>`}for(let i=keys.length;i<18;i++)h+='<div class="islot"></div>';
 return`<div class="pad" style="padding-top:10px;padding-bottom:10px"><div class="bgrid">${h}</div><p class="gemnote">${keys.length?'Tap a gem to fuse it or set it in a socket. Five matching gems fuse into one of the next level.':'Gems drop from bosses and elites. Set them in the sockets of Rare and better weapons, charms and cloaks.'}</p></div>`}
function gemTip(k){const g=gemParse(k),q=(P.gems||{})[k]||0;if(!g||!q){G.tip=null;return''}const b=gemBonus(k),open=SLOTS.filter(s=>{const it=P.eq[s];return it&&it.soc&&it.soc.includes(null)});
 return`<div class="tipwrap"><div class="icard"><div class="ic-h"><div class="ic-pic islot has" style="--rc:${RAR[g.r].c}">${gemIcon(k)}</div><b style="color:${RAR[g.r].c2}">${esc(gemName(k))}</b><button class="rx sm" data-act="tipclose" aria-label="Close">✕</button></div><div class="split"><span>Gem · you have ${q}</span><span>${RAR[g.r].n}</span></div><div class="st g">+${b.v}${b.st==='crit'?'%':''} ${STATN[b.st]}</div><div class="ic-btns"><button class="cbtn" data-act="gemfuse" ${q>=GEMFUSE&&g.l<GEMMAXL?'':'disabled'}>${g.l>=GEMMAXL?'Highest level':`Fuse ${GEMFUSE} into level ${g.l+1}`}</button></div>${open.length?`<div class="ic-btns">${open.map(s=>`<button class="cbtn" data-act="gemsock" data-slot="${s}">Set in ${esc(P.eq[s].name)}</button>`).join('')}</div>`:'<div style="color:var(--ink2);margin-top:8px">None of your equipped gear has an empty socket.</div>'}</div></div>`}
function itemCard(it,btns,rm){return`<div class="icard"><div class="ic-h"><div class="ic-pic islot has" style="--rc:${RAR[it.rar].c}">${itemIcon(it)}</div><b style="color:${RAR[it.rar].c2}">${esc(it.name)}</b><button class="rx sm" data-act="tipclose" aria-label="Close">✕</button></div>
 <div>${it.rar>=2?'Binds when picked up':'Binds when equipped'}</div><div class="split"><span>${esc(itemKind(it))} · Tier ${TIERR[it.tier||tierOf(it.ilvl)]}</span><span>${RAR[it.rar].n}</span></div>${statLines(it)}<div style="color:var(--ink2)">Item level ${it.ilvl}</div>${itemBroken(it)?'<div class="durtxt bad">Broken: gives no stats, gems or effects until repaired at a shop</div>':`<div class="durtxt ${itemDur(it)<=DUR.warnAt?'low':''}">Durability ${Math.ceil(itemDur(it))} / ${DUR.max}</div>`}
 ${it.uq?`<div class="legfx">Equip: ${esc(legByKey(it.uq).d)}</div>`:''}${socketsHTML(it,rm)}${btns?`<div class="ic-btns">${btns}</div>`:''}</div>`}
function cmpCard(it){const cur=P.eq[it.slot];if(!cur)return`<div class="icard"><div class="ic-h"><b>Equipment Comparison</b></div><div>Nothing is equipped in this slot. Equipping this is a straight upgrade.</div></div>`;
 let h='';for(const k of['wd','arm',...ATTR,...SPEC]){const d=(it.st[k]||0)-(cur.st[k]||0);if(Math.abs(d)<.05)continue;const v=PCT.has(k)?Math.abs(d).toFixed(1).replace(/\.0$/,'')+'%':RATE.has(k)?Math.abs(d).toFixed(1)+'/s':Math.abs(Math.round(d));h+=`<div class="st ${d>0?'g':'r'}">${d>0?'+':'-'}${v} ${STATN[k]}</div>`}
 return`<div class="icard"><div class="ic-h"><b>Equipment Comparison</b></div><div style="color:${RAR[cur.rar].c2};font:400 17px var(--f-ui)">${esc(cur.name)}</div>${h||'<div>No difference in stats.</div>'}${cur.uq&&!it.uq?'<div class="st r">Loses its legendary effect</div>':''}</div>`}
function tipHTML(){const tp=G.tip;if(!tp)return'';if(tp.src==='gem')return gemTip(tp.k);const it=tp.src==='eq'?P.eq[tp.slot]:P.bag[tp.idx];if(!it){G.tip=null;return''}
 if(it.slot==='use')return consTip(it);
 if(it.slot==='mat'){const D={ore:'Ore for the forge. Take it to any shop and use the Craft tab.',herb:'Brewed into tonics, and needed to forge gear at any shop.',gem:'A crystal needed to forge Rare and better gear.'};
  return`<div class="tipwrap"><div class="icard"><div class="ic-h"><div class="ic-pic islot has" style="--rc:${RAR[it.rar].c}">${itemIcon(it)}</div><b style="color:${RAR[it.rar].c2}">${esc(it.name)}</b><button class="rx sm" data-act="tipclose" aria-label="Close">✕</button></div><div class="split"><span>Material · stack of ${it.qty}</span><span>${RAR[it.rar].n}</span></div><div>${D[it.fam]}</div><div style="color:var(--ink2)">Worth ${matValue(it.fam,it.g)} gold each</div><div class="ic-btns"><button class="cbtn ${G.confirm===it.id?'warn':''}" data-act="salvage">${G.confirm===it.id?'Press again':'Sell all'} <span class="price">${itemValue(it)}</span><i class="coin"></i></button></div></div></div>`}
 let btns='';if(tp.src==='bag')btns=`<button class="cbtn" data-act="equip">Equip</button><button class="cbtn ${G.confirm===it.id?'warn':''}" data-act="salvage">${G.confirm===it.id?'Press again':'Sell'} <span class="price">${itemValue(it)}</span><i class="coin"></i></button>`;else btns=`<button class="cbtn" data-act="unequip" ${P.bag.length>=bagCap()?'disabled':''}>Unequip</button>`;
 return`<div class="tipwrap">${itemCard(it,btns,true)}${tp.src==='bag'?cmpCard(it):''}</div>`}
